name: 自动更新接口

on:
  schedule:
    # 每周一 02:00（北京时间）= 周日 18:00 UTC
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tvbox-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 隔离执行功能校验
        # 第三方脚本在容器里跑：不注入密钥、仓库只读、限制资源。
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p reports .cache
          docker run --rm \
            --network bridge \
            --memory 2g --cpus 2 --pids-limit 512 \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD":/work:ro \
            -v "$PWD/reports":/out \
            -v "$PWD/.cache":/cache \
            -w /tmp \
            python:3.12-slim \
            sh -c "pip install --quiet --no-cache-dir requests beautifulsoup4 pyquery pycryptodome lxml && python /work/scripts/functional_check.py --cache-dir /cache --output /out/functional-report.json"

      - name: 拉取、校验并更新接口.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_api.py --functional-report reports/functional-report.json

      - name: 上传校验报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            reports/validation-report.json
            reports/functional-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 提交并推送
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "接口.json"
          if git diff --cached --quiet; then
            echo "接口.json 没有变化，跳过提交"
          else
            git commit -m "chore: 自动更新接口.json ($(date -u +%F))"
            git push
          fi
